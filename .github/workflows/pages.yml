name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages for Actions
        continue-on-error: true
        run: |
          curl -sS -o /tmp/pages-post.json -w "POST %{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' || true
          curl -sS -o /tmp/pages-put.json -w "PUT %{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' || true
          cat /tmp/pages-post.json /tmp/pages-put.json || true
      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p _site/signs _site/data
          cp index.html _site/
          touch _site/.nojekyll
          if [ -f texas-qr-parking-report.pdf ]; then
            cp texas-qr-parking-report.pdf _site/
          elif [ -f texas-qr-parking-report.pdf.b64 ]; then
            base64 -d texas-qr-parking-report.pdf.b64 > _site/texas-qr-parking-report.pdf
          elif ls texas-qr-parking-report.pdf.b64.* >/dev/null 2>&1; then
            cat texas-qr-parking-report.pdf.b64.* | base64 -d > _site/texas-qr-parking-report.pdf
          fi
          for f in signs/*.jpg signs/*.jpg.b64; do
            [ -e "$f" ] || continue
            case "$f" in
              *.b64) base64 -d "$f" > "_site/signs/$(basename "${f%.b64}")" ;;
              *) cp "$f" _site/signs/ ;;
            esac
          done
          for f in data/*; do
            [ -e "$f" ] || continue
            case "$f" in
              *.b64) base64 -d "$f" > "_site/data/$(basename "${f%.b64}")" ;;
              *) cp "$f" _site/data/ ;;
            esac
          done
          test -s _site/index.html
          ls -la _site _site/signs _site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
